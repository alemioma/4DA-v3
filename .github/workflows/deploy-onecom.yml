- name: Deploy to one.com via FTP
  uses: SamKirkland/FTP-Deploy-Action@v4.3.5
  with:
    server: ${{ secrets.ONE_FTP_SERVER }}
    username: ${{ secrets.ONE_FTP_USERNAME }}
    password: ${{ secrets.ONE_FTP_PASSWORD }}
    port: ${{ secrets.ONE_FTP_PORT || 21 }}
    local-dir: ./src/dist/
    server-dir: .                    # ← Muy importante: punto (.)
    dangerous-clean-slate: true      # ← Actívalo temporalmente (limpia todo)
    exclude: |
      **/.DS_Store
      **/Thumbs.db
      **/*.map
      **/*.md
      **/.git*
      **/.vscode/**
      **/node_modules/**
