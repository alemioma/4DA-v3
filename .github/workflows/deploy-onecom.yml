- name: Deploy to one.com via FTP
  uses: SamKirkland/FTP-Deploy-Action@v4.3.5
  with:
    server: ${{ secrets.ONE_FTP_SERVER }}
    username: ${{ secrets.ONE_FTP_USERNAME }}
    password: ${{ secrets.ONE_FTP_PASSWORD }}
    port: ${{ secrets.ONE_FTP_PORT || 21 }}
    local-dir: ./src/dist/           # Asegúrate que esta carpeta exista
    server-dir: ./                   # ← Cambia esto (o déjalo vacío)
    dangerous-clean-slate: false
    exclude: |
      **/.DS_Store
      **/Thumbs.db
      **/*.map
      **/*.md
      **/.git*
      **/.vscode/**
      **/node_modules/**

      - name: Verify build output
  run: |
    echo "📂 Contenido de la carpeta de build:"
    ls -la ./src/dist
    test -f ./src/dist/index.html || (echo "❌ No se encontró index.html" && exit 1)

    - name: List build files before deploy
  run: |
    echo "Archivos que se van a subir:"
    find ./src/dist -type f | head -n 30
