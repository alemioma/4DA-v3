<!-- Developer Header -->
<header class="dev-header" data-dev-header>
  <div style="display: flex; align-items: center; gap: 1rem; flex: 1;">
    <!-- Mobile menu button -->
    <button type="button" class="dev-mobile-menu-btn" aria-label="Toggle navigation" data-dev-menu-toggle>
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true" style="width: 1.25rem; height: 1.25rem; stroke: rgb(24 24 27);">
        <path d="M2 5h16M2 10h16M2 15h16" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- Search button (desktop) -->
    <button type="button" class="dev-search-btn" id="devSearchBtn" data-dev-search-toggle aria-label="Find something...">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true" style="width: 1.25rem; height: 1.25rem; stroke: currentColor;">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12.01 12a4.25 4.25 0 1 0-6.02-6 4.25 4.25 0 0 0 6.02 6Zm0 0 3.24 3.25"/>
      </svg>
      Find something...
      <span class="dev-search-shortcut"><kbd style="font-family: inherit;">Ctrl</kbd><kbd style="font-family: inherit;">K</kbd></span>
    </button>
  </div>

  <div style="display: flex; align-items: center; gap: 1rem;">
    <!-- Back to main site link (mobile) -->
    <a href="index.html" class="dev-back-link" style="display: none;" id="devBackLinkMobile">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true" style="width: 1rem; height: 1rem;">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" d="M11.5 6.5l-3 3.5m0 0 3 3.5m-3-3.5h9"/>
      </svg>
      4DA
    </a>

    <!-- Theme toggle -->
    <button id="themeToggle" class="inline-flex items-center justify-center rounded-full border border-gray-200 bg-white px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-200" type="button" aria-label="Cambiar tema" aria-pressed="false" style="padding: 0.375rem; border-radius: 0.375rem; border: none; background: transparent;">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true" data-theme-icon="sun" style="width: 1.25rem; height: 1.25rem; stroke: rgb(24 24 27);">
        <path d="M10 1.25v1.5M15.18 4.82l-1.06 1.06M18.75 10h-1.5M15.18 15.18l-1.06-1.06M10 18.75v-1.5M4.82 15.18l1.06-1.06M1.25 10h1.5M4.82 4.82l1.06 1.06M10 5.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true" data-theme-icon="moon" style="width: 1.25rem; height: 1.25rem; stroke: rgb(24 24 27); display: none;">
        <path d="M8.25 3.75c-.77.55-1.42 1.26-1.89 2.09A4.5 4.5 0 0 0 10.75 14.5c.83 0 1.61-.24 2.27-.65-.44.34-.96.57-1.52.65-3.04.43-5.75-1.77-5.75-4.75 0-2.98 2.71-5.18 5.75-4.75.26.04.51.1.75.19Z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</header>

<!-- Search Dialog -->
<div class="dev-search-overlay" id="devSearchOverlay" data-dev-search-overlay></div>
<div class="dev-search-dialog" id="devSearchDialog" data-dev-search-dialog style="display: none;">
  <div class="dev-search-input-wrapper">
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true" style="width: 1.25rem; height: 1.25rem; stroke: rgb(161 161 170); position: absolute; left: 1rem; pointer-events: none;">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12.01 12a4.25 4.25 0 1 0-6.02-6 4.25 4.25 0 0 0 6.02 6Zm0 0 3.24 3.25"/>
    </svg>
    <input type="search" class="dev-search-input" id="devSearchInput" data-dev-search-input placeholder="Find something..." autocomplete="off">
  </div>
  <div class="dev-search-results" id="devSearchResults" data-dev-search-results></div>
</div>
