<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4DA - Test Suite</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .test-section { margin-bottom: 2rem; }
        .test-section h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 1rem; border-bottom: 2px solid #e5e7eb; padding-bottom: 0.5rem; }
        .test-result { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px solid #f3f4f6; }
        .test-status { width: 1.5rem; height: 1.5rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; flex-shrink: 0; }
        .test-status.pass { background: #dcfce7; color: #166534; }
        .test-status.fail { background: #fee2e2; color: #991b1b; }
        .test-status.pending { background: #fef9c3; color: #854d0e; }
        .test-label { flex: 1; }
        .test-label code { background: #f3f4f6; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.875rem; }
        .test-detail { font-size: 0.875rem; color: #6b7280; margin-top: 0.25rem; }
        #summary { padding: 1rem; border-radius: 0.5rem; margin-bottom: 2rem; }
        #summary.all-pass { background: #dcfce7; border: 1px solid #86efac; }
        #summary.has-fail { background: #fee2e2; border: 1px solid #fca5a5; }
        #summary h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
        .run-btn { padding: 0.5rem 1rem; border-radius: 0.375rem; font-weight: 500; cursor: pointer; border: none; font-size: 0.875rem; }
        .run-btn.primary { background: #7c3aed; color: white; }
        .run-btn.primary:hover { background: #6d28d9; }
        .run-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body class="bg-white text-gray-900">
    <div class="max-w-4xl mx-auto px-8 py-12">
        <div id="summary" class="hidden">
            <h1 id="summary-title"></h1>
            <p id="summary-text"></p>
        </div>

        <div class="flex items-center justify-between mb-8">
            <h1 class="text-3xl font-bold">4DA Test Suite</h1>
            <button id="run-tests" class="run-btn primary" onclick="runAllTests()">Run All Tests</button>
        </div>

        <div class="test-section" id="section-routes">
            <h2>1. Route Validation</h2>
            <div id="route-results"></div>
        </div>

        <div class="test-section" id="section-navlinks">
            <h2>2. Navbar Links</h2>
            <div id="navlink-results"></div>
        </div>

        <div class="test-section" id="section-includes">
            <h2>3. Include Sections</h2>
            <div id="include-results"></div>
        </div>

        <div class="test-section" id="section-pages">
            <h2>4. Page Content</h2>
            <div id="page-results"></div>
        </div>
    </div>

    <script src="/tests/test.js"></script>
</body>
</html>
